# Fly.io app config
# PLACEHOLDER: set app to <APP_NAME> after Michael creates the Fly app (must be unique).
# Docs: https://fly.io/docs/reference/configuration/
# Full steps: deploy/FLY_DEPLOY.md

app = "research-mcp-mhh"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"

[env]
  HOST = "::"  # dual-stack; Fly proxy is IPv6
  PORT = "3000"
  NODE_ENV = "production"
  # LIVE_RESEARCH set via `fly secrets` if needed

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
